name: ci

# The package against the oldest supported Hermes and current main, on Linux, macOS and Windows.
# The nightly run catches a core change that breaks the plugin before a user does.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/validate.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: desktop/plugin.js is the committed build of src/
        run: git diff --exit-code desktop/plugin.js

  hermes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        hermes: [v0.22.5, main]
    runs-on: ${{ matrix.os }}
    name: hermes ${{ matrix.hermes }} · ${{ matrix.os }}
    steps:
      - name: Allow long paths (hermes-agent's i18n docs tree exceeds MAX_PATH)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes }}
          path: hermes-agent
      # Hermes core gates its runtime dependencies on python_version >= '3.14'.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install hermes-agent
        shell: bash
        # Through uv with core's [tool.uv] override-dependencies, the way Hermes installs itself.
        run: |
          python -m pip install uv
          python -c 'import sys,tomllib; print("\n".join(tomllib.load(open(sys.argv[1], "rb")).get("tool", {}).get("uv", {}).get("override-dependencies", [])))' hermes-agent/pyproject.toml > "$RUNNER_TEMP/core-overrides.txt"
          pyexe=$(python -c 'import sys; print(sys.executable)')
          python -m uv pip install --python "$pyexe" --override "$RUNNER_TEMP/core-overrides.txt" -e ./hermes-agent pytest
      - name: Validate the package against core
        shell: bash
        run: python -m hermes_cli.main plugins validate --install-deps plugin
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          HERMES_RUNTIME_DIR: ${{ runner.temp }}/hermes-home/runtime
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
      - name: Contract and docs tests
        working-directory: plugin
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
        run: python -m pytest tests -q
